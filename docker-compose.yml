services:
  db01:
    image: mariadb:10.5
    environment:
      MARIADB_ROOT_PASSWORD: admin123
      MARIADB_DATABASE: accounts
      MARIADB_USER: admin
      MARIADB_PASSWORD: admin123
    volumes:
      - ./src/main/resources/db_backup.sql:/docker-entrypoint-initdb.d/db_backup.sql
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  mc01:
    image: memcached

  rmq01:
    image: rabbitmq:3
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test

  app01:
    build: .
    depends_on:
      db01:
        condition: service_healthy
      mc01:
        condition: service_started
      rmq01:
        condition: service_started
    restart: on-failure

  web01:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app01

volumes:
  dbdata:
